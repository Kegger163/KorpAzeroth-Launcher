
name: Build KorpAzeroth Launcher for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Windows launcher
        run: pyinstaller --noconfirm --clean --windowed --onedir --name KorpAzeroth-Launcher main.py

      - name: Package launcher
        shell: pwsh
        run: Compress-Archive -Path dist/KorpAzeroth-Launcher/* -DestinationPath KorpAzeroth-Launcher-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: KorpAzeroth-Launcher-Windows
          path: KorpAzeroth-Launcher-Windows.zip
